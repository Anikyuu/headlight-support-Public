<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>デザインを試す | Head-Light</title>
  <meta name="description" content="Head-Lightの新しいデザインを、ここで少しお試し。ボディーや顔を選んで、自分好みのホーム画面に。">
  <link rel="canonical" href="https://head-light.app/design.html">
  <link rel="stylesheet" href="design-assets/design.css?v=20260906-random-pose">
  <link rel="stylesheet" href="design-assets/device.css?v=20260906-random-pose">
  <script type="module" src="design-assets/design.js?v=20260906-random-pose"></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="./">Head-Light<span class="brand-dot" aria-hidden="true"></span></a>
    <label class="language"><span class="sr-only" data-copy="language">言語</span><select id="language" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option><option value="de">Deutsch</option><option value="zh-Hant">繁體中文</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option></select></label>
  </header>
  <main>
    <div class="intro"><p class="eyebrow" data-copy="eyebrow">デザインで、気分を変える。</p><h1 data-copy="title">あなたなら、どんな顔？</h1><p data-copy="intro">ボディーと顔を選ぶだけ。気分にぴったりのHead-Lightに。</p></div>
    <div class="studio">
      <section class="preview" aria-label="プレビュー" id="preview-region">
        <div class="device-stage">
          <div class="device-shadow" aria-hidden="true"></div>
          <div class="device" id="device" tabindex="0" role="group" aria-label="スマートフォンをドラッグして向きを変える" aria-describedby="rotate-hint">
            <div class="device-depth" aria-hidden="true"><i style="--layer:0"></i><i style="--layer:1"></i><i style="--layer:2"></i><i style="--layer:3"></i><i style="--layer:4"></i><i style="--layer:5"></i><i style="--layer:6"></i><i style="--layer:7"></i><i style="--layer:8"></i><i style="--layer:9"></i><i style="--layer:10"></i><i style="--layer:11"></i></div>
            <span class="device-key key-action" aria-hidden="true"></span><span class="device-key key-up" aria-hidden="true"></span><span class="device-key key-down" aria-hidden="true"></span><span class="device-key key-power" aria-hidden="true"></span>
            <div class="device-rim"><div class="device-bezel"><div class="phone-holder"><svg id="phone" viewBox="0 0 420 913" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="preview-title"><title id="preview-title">ホーム画面のデザインプレビュー</title></svg><div class="screen-glass" aria-hidden="true"></div></div></div></div>
          </div>
        </div>
        <span class="rotate-hint" id="rotate-hint" data-copy="rotateHint">ドラッグして動かせます</span>
        <button class="view-angle" id="view-angle" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z M3 7l9 5 9-5 M12 12v10"/></svg><span data-copy="frontView">正面から見る</span></button>
        <span class="preview-caption" data-copy="preview">ホーム画面のプレビュー</span>
      </section>
      <section class="controls" aria-label="デザイン" id="controls-region">
        <div class="quick-actions"><button class="shuffle" id="shuffle" type="button"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="16" cy="16" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span data-copy="shuffle">ランダム</span></button><button class="reset" id="reset" type="button" data-copy="reset">最初に戻す</button></div>
        <fieldset><legend data-copy="body">ボディー</legend><div class="body-choices" id="body-choices"></div></fieldset>
        <fieldset id="face-field"><legend data-copy="face">顔あそび</legend><div class="face-choices" id="face-choices"></div><details class="fine-settings"><summary data-copy="adjust">大きさ・間隔を調整</summary><div class="sliders"><label for="size"><span data-copy="size">大きさ</span><input id="size" type="range" min="0.6" max="1.7" step="0.01" value="1.32"></label><label for="spacing"><span data-copy="spacing">間隔</span><input id="spacing" type="range" min="10" max="110" step="1" value="78"></label><label for="height"><span data-copy="height">高さ</span><input id="height" type="range" min="0" max="110" step="1" value="49"></label></div><label class="toggle-label"><span data-copy="motion">まばたき</span><input id="motion" type="checkbox" role="switch" checked><span class="switch" aria-hidden="true"></span></label></details></fieldset>
        <fieldset class="style-field"><legend class="sr-only" data-copy="style">スタイル</legend><div class="segmented" id="style-choices"></div></fieldset>
        <fieldset class="retro-field"><legend class="sr-only" data-copy="retro">レトロモード</legend><label class="toggle-label"><span data-copy="retro">レトロモード</span><input id="retro" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label><div id="retro-options" hidden><p class="choice-value" id="retro-value"></p><div class="swatches" id="retro-choices"></div></div></fieldset>
        <p class="fine-print" data-copy="note">デザインの一部を試せる体験版です。入力・録音などはできません。</p>
        <p class="fine-print" data-copy="release">新しいデザインは、次のアップデートでお届けします。</p>
      </section>
    </div>
    <noscript><p>JavaScriptを有効にすると、色や顔を変えて試せます。 / Enable JavaScript to try the designs.</p></noscript>
  </main>
  <footer><a href="./" data-copy="back">← Head-Lightについて</a><span>Head-Light</span></footer>
</body>
</html>
