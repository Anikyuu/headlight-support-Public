<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="誰かの『好き』が詰まったHeadlightコレクション。棚の順番で見て、再生して、自分の棚へ。">
  <meta property="og:title" content="A collection from Headlight">
  <meta property="og:description" content="Open a shelf of favorite links and videos. Everyone has a B-side.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://head-light.app/share.html">
  <title>A collection from Headlight</title>
  <style>
    :root{--bg:#fff;--paper:#fff;--ink:#111;--muted:#666;--line:rgba(17,17,17,.12);--button:#111;--buttonText:#fff}
    *{box-sizing:border-box} [hidden]{display:none!important} html{background:var(--bg)}
    body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
    main{width:min(760px,100%);margin:auto;padding:42px 18px 80px}
    header{text-align:center;padding:26px 8px 34px}.brand{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.18em}
    h1{font-size:clamp(36px,10vw,64px);line-height:1.08;margin:16px 0 10px;text-wrap:balance;font-weight:750}
    .notice{color:var(--muted)}
    .actions{display:grid;grid-template-columns:repeat(3,54px);gap:10px;justify-content:center;margin:22px 0 0}
    #shuffle{grid-column:1;grid-row:1}#play{grid-column:2;grid-row:1}#openApp{grid-column:3;grid-row:1}
    button,.button{appearance:none;border:1px solid var(--line);border-radius:999px;padding:12px 18px;background:var(--button);color:var(--buttonText);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
    .button.secondary{background:#fff;color:var(--ink)}
    .iconButton{display:inline-grid;place-items:center;width:54px;height:54px;padding:0;border-radius:50%}
    .iconButton svg{width:23px;height:23px;display:block}
    #playerWrap{display:none;margin:0 auto 12px;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
    #player,#player iframe,#youtubeMount{width:100%;height:100%}
    .playerMeta{display:none;width:100%;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 28px}
    .playerText{min-width:0}
    .playerBadge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px}
    .playerTitle{font-size:16px;font-weight:700;line-height:1.4}
    .playerHost{font-size:12px;color:var(--muted);margin-top:4px}
    .playerButtons{grid-column:1/-1;width:100%;display:grid;grid-template-columns:repeat(3,60px);gap:18px;justify-content:center;margin-top:8px}
    #prevTrack{grid-column:1}#addTrack{grid-column:2}#nextTrack{grid-column:3}
    .trackButton{display:inline-grid;place-items:center;width:60px;height:60px;padding:0;border-radius:50%}
    .trackButton svg{width:29px;height:29px;display:block}
    .musicAlbums{display:grid;gap:18px;margin-bottom:20px}
    .albumCard{border:1px solid var(--line);border-radius:20px;padding:18px;background:#fff}
    .albumTop{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
    .albumArtwork{width:150px;aspect-ratio:1;background:#f2f2f2;border-radius:12px;object-fit:cover;display:block}
    .albumBadge{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}
    .albumTitle{font-size:clamp(23px,5vw,34px);font-weight:760;line-height:1.14;text-wrap:balance}
    .albumArtist{color:var(--muted);font-size:14px;margin-top:5px}
    .albumActions{display:flex;gap:10px;margin-top:16px}
    .albumAction{display:inline-grid;place-items:center;width:46px;height:46px;padding:0;border-radius:50%}
    .albumAction svg{width:21px;height:21px}
    .trackList{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--line)}
    .musicTrack{display:grid;grid-template-columns:30px minmax(0,1fr) 38px 38px;gap:7px;align-items:center;min-height:48px;border-bottom:1px solid var(--line)}
    .musicTrack:last-child{border-bottom:0}.trackNumber{font-size:12px;color:var(--muted);text-align:center}
    .trackName{font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .miniAction{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border-radius:50%}
    .miniAction svg{width:16px;height:16px}.albumError{color:var(--muted);font-size:13px;padding:16px}
    .shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .card{display:grid;grid-template-columns:28px 34% minmax(0,1fr) 46px;align-items:center;color:inherit;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:background .18s ease,border-color .18s ease}
    .card:hover{background:#fafafa;border-color:rgba(17,17,17,.18)}
    .artWrap{position:relative;width:100%;aspect-ratio:16/9;background:#f2f2f2;overflow:hidden}
    .art{width:100%;height:100%;object-fit:contain;display:block;background:#f2f2f2}
    .placeholder{display:grid;place-items:center;font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
    .body{min-width:0;padding:10px 8px 10px 10px}.number{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
    .title{font-weight:680;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.artist,.host{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cardActions{display:flex;align-items:center;justify-content:center;padding-right:6px}
    .inlinePlay,.source{appearance:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;padding:0;text-decoration:none;cursor:pointer}
    .inlinePlay svg,.source svg{width:19px;height:19px;display:block}
    .inlinePlay{border:1px solid var(--line);background:#111;color:#fff}
    .source{border:1px solid var(--line);background:#fff;color:var(--ink)}
    .notice{font-size:13px;text-align:center;margin:28px auto 0;max-width:48em}.legal{font-size:11px;text-align:center;margin-top:18px;color:var(--muted)}
    .legal a{color:inherit}.error{background:#fff;border:1px solid #d8d8d8;border-radius:16px;padding:18px;color:#222}
    @media(max-width:520px){main{padding-top:24px}.shelf{grid-template-columns:1fr}.card{grid-template-columns:30px 36% minmax(0,1fr) 48px}.albumCard{padding:14px}.albumTop{grid-template-columns:112px minmax(0,1fr);gap:14px}.albumArtwork{width:112px}.albumAction{width:44px;height:44px}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">HEADLIGHT COLLECTION</div>
    <h1 id="name">Shared collection</h1>
    <div class="actions" id="actions" hidden>
      <button id="shuffle" class="button secondary iconButton" aria-label="Shuffle" title="Shuffle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 6h3c4.5 0 5.5 12 10 12h4M16 21h5v-5M4 18h3c1.7 0 2.9-1.7 4-3.8M14 7.2C15 5.5 16 6 21 6"/></svg>
      </button>
      <button id="play" class="iconButton" aria-label="Play" title="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l10-6.5z"/></svg>
      </button>
      <a class="button secondary iconButton" id="openApp" aria-label="Add to Headlight" title="Add to Headlight" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      </a>
    </div>
  </header>
  <div id="playerWrap"><div id="player"><div id="youtubeMount"></div></div></div>
  <div class="playerMeta" id="playerMeta">
    <div class="playerText">
      <div class="playerBadge" id="playerBadge"></div>
      <div class="playerTitle" id="playerTitle"></div>
      <div class="playerHost" id="playerHost"></div>
    </div>
    <div class="playerButtons">
      <button id="prevTrack" class="button secondary trackButton" aria-label="Previous" title="Previous" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 5h2v14H6zm12 1.2v11.6L9.5 12z"/></svg>
      </button>
      <button id="addTrack" class="button secondary trackButton" aria-label="Add current track" title="Add current track" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="nextTrack" class="button secondary trackButton" aria-label="Next" title="Next" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 5h2v14h-2zM6 6.2 14.5 12 6 17.8z"/></svg>
      </button>
    </div>
  </div>
  <section id="musicAlbums" class="musicAlbums" hidden></section>
  <div id="content" class="shelf"></div>
  <p class="notice" id="snapshot" hidden>共有された時点のコピーです。元の棚とは同期しません。<br>This is a snapshot and does not sync with the sender.</p>
  <p class="legal" id="legal" hidden>Playback uses the official embedded player provided by each service when available. Some videos may open best on their original page.</p>
</main>
<script>
  const MAX_ENTRIES = 48;
  const content = document.getElementById('content');
  const musicAlbums = document.getElementById('musicAlbums');
  let playableItems = [];
  let currentQueue = [];
  let currentIndex = 0;
  let youtubePlayer = null;
  let youtubePlayerReady = false;
  let pendingYouTubeID = null;
  // Different shared links use the same static page and differ only by their
  // fragment. Browsers do not reload on a fragment-only navigation by default.
  window.addEventListener('hashchange', () => location.reload());

  function decodePayload() {
    const params = new URLSearchParams(location.hash.slice(1));
    const payload = params.get('collection');
    if (!payload) throw new Error('No collection was found in this link.');
    let base64 = payload.replace(/-/g,'+').replace(/_/g,'/');
    base64 += '='.repeat((4 - base64.length % 4) % 4);
    const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const data = JSON.parse(new TextDecoder().decode(bytes));
    if (data.version !== 1 || !data.name || !Array.isArray(data.entries) || !data.entries.length || data.entries.length > MAX_ENTRIES) {
      throw new Error('This collection link is not supported.');
    }
    data.entries.forEach(entry => {
      const url = new URL(entry.url);
      if (!['http:','https:'].includes(url.protocol)) throw new Error('Unsafe link.');
    });
    return {data, payload};
  }

  function youtubeID(value) {
    try {
      const url = new URL(value), host = url.hostname.toLowerCase();
      let id = null;
      if (host === 'youtu.be' || host.endsWith('.youtu.be')) id = url.pathname.split('/').filter(Boolean)[0];
      else if (host === 'youtube.com' || host.endsWith('.youtube.com')) {
        id = url.searchParams.get('v');
        if (!id) {
          const parts = url.pathname.split('/').filter(Boolean);
          const marker = parts.findIndex(x => ['shorts','embed','live'].includes(x));
          if (marker >= 0) id = parts[marker + 1];
        }
      }
      return /^[A-Za-z0-9_-]{11}$/.test(id || '') ? id : null;
    } catch { return null; }
  }

  function tiktokID(value) {
    try {
      const url = new URL(value), host = url.hostname.toLowerCase();
      if (!(host === 'tiktok.com' || host.endsWith('.tiktok.com'))) return null;
      const parts = url.pathname.split('/').filter(Boolean);
      const marker = parts.findIndex(x => x === 'video');
      const id = marker >= 0 ? parts[marker + 1] : null;
      return /^\d{6,}$/.test(id || '') ? id : null;
    } catch { return null; }
  }

  function instagramEmbedPath(value) {
    try {
      const url = new URL(value), host = url.hostname.toLowerCase();
      if (!(host === 'instagram.com' || host.endsWith('.instagram.com') || host === 'instagr.am')) return null;
      const parts = url.pathname.split('/').filter(Boolean);
      const marker = parts.find(x => ['reel', 'reels', 'p'].includes(x));
      const markerIndex = parts.findIndex(x => x === marker);
      const code = markerIndex >= 0 ? parts[markerIndex + 1] : null;
      if (!marker || !code) return null;
      const kind = marker === 'p' ? 'p' : 'reel';
      return `https://www.instagram.com/${kind}/${code}/embed`;
    } catch { return null; }
  }

  function playableFor(entry) {
    const youtube = youtubeID(entry.url);
    if (youtube) {
      return {
        id: entry.id || `${entry.order}-${entry.url}`,
        entry,
        provider: 'youtube',
        badge: 'YouTube',
        youtubeID: youtube,
        embedURL: `https://www.youtube.com/embed/${youtube}?autoplay=1&playsinline=1&rel=0&modestbranding=1`,
        thumbnailURL: `https://i.ytimg.com/vi/${youtube}/mqdefault.jpg`
      };
    }
    const tiktok = tiktokID(entry.url);
    if (tiktok) {
      return {
        id: entry.id || `${entry.order}-${entry.url}`,
        entry,
        provider: 'tiktok',
        badge: 'TikTok',
        embedURL: `https://www.tiktok.com/player/v1/${tiktok}?controls=1&description=1&music_info=1`,
        thumbnailURL: null
      };
    }
    const instagram = instagramEmbedPath(entry.url);
    if (instagram) {
      return {
        id: entry.id || `${entry.order}-${entry.url}`,
        entry,
        provider: 'instagram',
        badge: 'Instagram',
        embedURL: instagram,
        thumbnailURL: null
      };
    }
    return null;
  }

  function isAppleMusicEntry(entry) {
    try {
      const host = new URL(entry.url).hostname.toLowerCase();
      return host === 'music.apple.com' || host.endsWith('.music.apple.com')
        || (Array.isArray(entry.storeTrackIDs) && entry.storeTrackIDs.length > 0);
    } catch { return false; }
  }

  function storefrontCountry() {
    const region = (navigator.language || '').split('-')[1];
    return /^[A-Za-z]{2}$/.test(region || '') ? region.toUpperCase() : 'US';
  }

  function numericAppleID(value) {
    try {
      const url = new URL(value);
      const trackID = url.searchParams.get('i');
      if (/^\d+$/.test(trackID || '')) return trackID;
      const parts = url.pathname.split('/').filter(Boolean).reverse();
      return parts.find(part => /^\d+$/.test(part)) || null;
    } catch { return null; }
  }

  function largeAppleArtwork(value) {
    if (!value) return null;
    return value.replace(/\d+x\d+bb(?=\.(jpg|png))/i, '800x800bb');
  }

  async function itunesJSON(path, query) {
    const url = new URL(`https://itunes.apple.com/${path}`);
    Object.entries(query).forEach(([key,value]) => url.searchParams.set(key, value));
    const response = await fetch(url, {headers:{Accept:'application/json'}});
    if (!response.ok) throw new Error('Apple Music lookup failed.');
    return response.json();
  }

  function normalizedMusicText(value) {
    return (value || '').toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  }

  async function resolveAppleMusicAlbum(entry) {
    const country = storefrontCountry();
    let lookupID = Array.isArray(entry.storeTrackIDs)
      ? entry.storeTrackIDs.find(value => /^\d+$/.test(value))
      : null;
    lookupID ||= numericAppleID(entry.url);
    let collectionID = null;

    if (lookupID) {
      const seed = await itunesJSON('lookup', {id:lookupID, entity:'song', country});
      const item = (seed.results || []).find(result => result.collectionId || result.wrapperType === 'collection');
      collectionID = item?.collectionId || (item?.wrapperType === 'collection' ? item.collectionId : null);
      // アルバムID自体でlookupした場合は、先頭結果のcollectionIdがそのID。
      collectionID ||= (seed.results || []).find(result => result.wrapperType === 'collection')?.collectionId;
    }

    if (!collectionID) {
      const term = [entry.artist, entry.title].filter(Boolean).join(' ').trim();
      if (!term) throw new Error('No album name.');
      const search = await itunesJSON('search', {term, entity:'album', limit:'10', country});
      const wantedTitle = normalizedMusicText(entry.title);
      const wantedArtist = normalizedMusicText(entry.artist);
      const candidates = search.results || [];
      const best = candidates.find(result =>
        (!wantedTitle || normalizedMusicText(result.collectionName) === wantedTitle)
        && (!wantedArtist || normalizedMusicText(result.artistName).includes(wantedArtist))
      ) || candidates[0];
      collectionID = best?.collectionId;
    }
    if (!collectionID) throw new Error('Album not found.');

    const response = await itunesJSON('lookup', {id:String(collectionID), entity:'song', country});
    const results = response.results || [];
    const album = results.find(result => result.wrapperType === 'collection') || results[0];
    const tracks = results
      .filter(result => result.wrapperType === 'track' && result.trackId)
      .sort((a,b) => (a.discNumber || 1) - (b.discNumber || 1) || (a.trackNumber || 0) - (b.trackNumber || 0));
    if (!album && !tracks.length) throw new Error('Album not found.');
    return {
      title: album?.collectionName || entry.title,
      artist: album?.artistName || entry.artist,
      url: album?.collectionViewUrl || entry.url,
      artwork: largeAppleArtwork(album?.artworkUrl100 || tracks[0]?.artworkUrl100),
      collectionID,
      tracks
    };
  }

  function headlightImportURL(entry, mode) {
    const collection = {
      version: 1,
      id: makeUUID(),
      name: entry.title || 'Apple Music',
      skin: 'normal',
      mode,
      entries: [{
        title: entry.title || '',
        url: entry.url,
        artist: entry.artist || null,
        order: 0,
        pinned: false,
        trackTitles: entry.trackTitles || null,
        storeTrackIDs: entry.storeTrackIDs || null
      }]
    };
    return `https://open.head-light.app/import/#collection=${encodeCollection(collection)}`;
  }

  function iconButton(className, label, path, handlerOrURL) {
    const element = typeof handlerOrURL === 'string' ? document.createElement('a') : document.createElement('button');
    element.className = className;
    element.setAttribute('aria-label', label);
    element.title = label;
    element.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
    if (typeof handlerOrURL === 'string') {
      element.href = handlerOrURL;
      element.target = '_blank';
      element.rel = 'noopener noreferrer';
    } else {
      element.type = 'button';
      element.addEventListener('click', handlerOrURL);
    }
    return element;
  }

  async function appleMusicAlbumCard(entry) {
    const article = document.createElement('article');
    article.className = 'albumCard';
    article.setAttribute('aria-busy', 'true');
    const loading = document.createElement('div');
    loading.className = 'albumError';
    loading.textContent = entry.title || 'Apple Music';
    article.append(loading);
    musicAlbums.append(article);
    musicAlbums.hidden = false;

    try {
      const album = await resolveAppleMusicAlbum(entry);
      const top = document.createElement('div'); top.className = 'albumTop';
      const artwork = document.createElement('img'); artwork.className = 'albumArtwork'; artwork.alt = '';
      if (album.artwork) artwork.src = album.artwork;
      const info = document.createElement('div');
      const badge = document.createElement('div'); badge.className = 'albumBadge'; badge.textContent = 'Apple Music';
      const title = document.createElement('div'); title.className = 'albumTitle'; title.textContent = album.title || entry.title;
      const artist = document.createElement('div'); artist.className = 'albumArtist'; artist.textContent = album.artist || entry.artist || '';
      const actions = document.createElement('div'); actions.className = 'albumActions';
      const albumEntry = {
        title: album.title || entry.title,
        artist: album.artist || entry.artist || null,
        url: album.url,
        trackTitles: album.tracks.map(track => track.trackName).filter(Boolean),
        storeTrackIDs: album.tracks[0]?.trackId ? [String(album.tracks[0].trackId)] : entry.storeTrackIDs
      };
      actions.append(
        iconButton('button secondary albumAction', 'Open in Apple Music', '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 5h5v5M19 5l-8 8M11 6H6a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-5"/>', album.url),
        // modeは配布済みのビルド18も理解できるsingleEntryを維持。
        // 新ビルドはtrackTitlesが複数あるApple Music項目をアルバムと判定する。
        iconButton('button secondary albumAction', 'Add album to Headlight', '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/>', () => { location.href = headlightImportURL(albumEntry, 'singleEntry'); })
      );
      info.append(badge,title,artist,actions); top.append(artwork,info);

      const list = document.createElement('ol'); list.className = 'trackList';
      album.tracks.forEach((track,index) => {
        const row = document.createElement('li'); row.className = 'musicTrack';
        const number = document.createElement('span'); number.className = 'trackNumber'; number.textContent = String(track.trackNumber || index + 1);
        const name = document.createElement('span'); name.className = 'trackName'; name.textContent = track.trackName || '';
        const trackURL = track.trackViewUrl || album.url;
        const trackEntry = {
          title: track.trackName || '', artist: track.artistName || album.artist || null, url: trackURL,
          trackTitles: track.trackName ? [track.trackName] : null,
          storeTrackIDs: track.trackId ? [String(track.trackId)] : null
        };
        const open = iconButton('button secondary miniAction', 'Open in Apple Music', '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 5h5v5M19 5l-8 8M11 6H6a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-5"/>', trackURL);
        const add = iconButton('button secondary miniAction', 'Add track to Headlight', '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/>', () => { location.href = headlightImportURL(trackEntry, 'singleEntry'); });
        row.append(number,name,open,add); list.append(row);
      });
      article.replaceChildren(top,list);
      article.setAttribute('aria-busy', 'false');
    } catch {
      article.replaceChildren(card(entry, Number(entry.order) || 0));
      article.setAttribute('aria-busy', 'false');
    }
  }

  function buildQueueFrom(itemID) {
    const startIndex = playableItems.findIndex(item => item.id === itemID);
    if (startIndex < 0) return [];
    return [...playableItems.slice(startIndex), ...playableItems.slice(0, startIndex)];
  }

  function loadYouTubePlayerAPI() {
    if (window.YT?.Player || document.getElementById('youtube-api')) {
      if (window.YT?.Player) prepareYouTubePlayer();
      return;
    }
    const script = document.createElement('script');
    script.id = 'youtube-api';
    script.src = 'https://www.youtube.com/iframe_api';
    document.head.append(script);
  }

  window.onYouTubeIframeAPIReady = function() {
    prepareYouTubePlayer();
  };

  function prepareYouTubePlayer(seedID = null) {
    if (youtubePlayer || !window.YT?.Player) return;
    const first = seedID || playableItems.find(item => item.provider === 'youtube')?.youtubeID;
    if (!first) return;
    const container = document.getElementById('player');
    container.replaceChildren();
    const mount = document.createElement('div');
    mount.id = 'youtubeMount';
    container.append(mount);
    youtubePlayerReady = false;
    youtubePlayer = new YT.Player('youtubeMount', {
      width: '100%',
      height: '100%',
      videoId: first,
      playerVars: {
        autoplay: 0,
        controls: 1,
        playsinline: 1,
        rel: 0,
        origin: location.origin
      },
      events: {
        onReady(event) {
          youtubePlayerReady = true;
          if (pendingYouTubeID) {
            const videoID = pendingYouTubeID;
            pendingYouTubeID = null;
            event.target.loadVideoById(videoID);
          }
        },
        onStateChange(event) {
          if (event.data === YT.PlayerState.ENDED && currentQueue.length > 1) {
            stepPlayback(1);
          }
        },
        onError() {
          if (currentQueue.length > 1) setTimeout(() => stepPlayback(1), 250);
        }
      }
    });
  }

  function playYouTube(item) {
    pendingYouTubeID = item.youtubeID;
    if (!youtubePlayer) prepareYouTubePlayer(item.youtubeID);
    if (youtubePlayerReady && youtubePlayer) {
      const videoID = pendingYouTubeID;
      pendingYouTubeID = null;
      youtubePlayer.loadVideoById(videoID);
    }
  }

  function discardYouTubePlayer() {
    if (youtubePlayer) {
      try { youtubePlayer.destroy(); } catch {}
    }
    youtubePlayer = null;
    youtubePlayerReady = false;
    pendingYouTubeID = null;
  }

  function card(entry, index) {
    const wrapper = document.createElement('article');
    wrapper.className = 'card';
    const playable = playableFor(entry);
    const artWrap = document.createElement('div'); artWrap.className = 'artWrap';
    let art;
    if (playable?.thumbnailURL) {
      art = document.createElement('img'); art.className = 'art'; art.loading = 'lazy';
      art.src = playable.thumbnailURL; art.alt = '';
    } else {
      art = document.createElement('div'); art.className = 'art placeholder'; art.textContent = playable?.badge || 'LINK';
    }
    artWrap.append(art);
    const body = document.createElement('div'); body.className = 'body';
    const number = document.createElement('div'); number.className = 'number'; number.textContent = `${index + 1}`;
    const title = document.createElement('div'); title.className = 'title';
    const url = new URL(entry.url); title.textContent = entry.title || url.hostname.replace(/^www\./,'');
    const detail = document.createElement('div'); detail.className = entry.artist ? 'artist' : 'host';
    detail.textContent = entry.artist || url.hostname.replace(/^www\./,'');
    const actions = document.createElement('div'); actions.className = 'cardActions';
    if (playable) {
      const playHere = document.createElement('button');
      playHere.className = 'inlinePlay';
      playHere.type = 'button';
      playHere.setAttribute('aria-label', 'Play');
      playHere.title = 'Play';
      playHere.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l10-6.5z"/></svg>';
      playHere.addEventListener('click', () => startPlayback(buildQueueFrom(playable.id)));
      actions.append(playHere);
    } else {
      const openSource = document.createElement('a');
      openSource.className = 'source';
      openSource.href = entry.url;
      openSource.target = '_blank';
      openSource.rel = 'noopener noreferrer';
      openSource.setAttribute('aria-label', 'Open link');
      openSource.title = 'Open link';
      openSource.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 5h5v5M19 5l-8 8M11 6H6a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-5"/></svg>';
      actions.append(openSource);
    }
    body.append(title,detail);
    wrapper.append(number,artWrap,body);
    if (actions.childElementCount) wrapper.append(actions);
    return wrapper;
  }

  try {
    const {data,payload} = decodePayload();
    document.getElementById('name').textContent = data.name;
    document.title = `${data.name} — Headlight`;
    const sorted = [...data.entries].sort((a,b) => a.order - b.order);
    sorted.forEach((entry,index) => {
      if (isAppleMusicEntry(entry)) {
        appleMusicAlbumCard(entry);
      } else {
        content.append(card(entry,index));
      }
    });
    playableItems = sorted.map(playableFor).filter(Boolean);
    if (playableItems.some(item => item.provider === 'youtube')) loadYouTubePlayerAPI();
    document.getElementById('actions').hidden = false;
    document.getElementById('snapshot').hidden = false;
    document.getElementById('legal').hidden = playableItems.length === 0;
    document.getElementById('play').hidden = playableItems.length === 0;
    document.getElementById('shuffle').hidden = playableItems.length < 2;
    document.getElementById('play').setAttribute('aria-label', playableItems.length > 1 ? 'Play all' : 'Play');
    document.getElementById('play').title = playableItems.length > 1 ? 'Play all' : 'Play';
    // The old headlight:// URL exposed the entire payload in a browser permission
    // prompt. Keep this control hidden until the Universal Link host is live and
    // the receiving app build has shipped; then unhiding it needs no URL-scheme prompt.
    document.getElementById('openApp').href = `https://open.head-light.app/import/#collection=${payload}`;
  } catch (error) {
    document.getElementById('name').textContent = 'Collection not found';
    content.className = 'error';
    content.textContent = 'この共有リンクを読み込めませんでした。 / This shared Collection could not be opened.';
  }

  function shuffledCopy(items) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    if (result.length > 1 && result.every((value,index) => value === items[index])) {
      [result[0], result[1]] = [result[1], result[0]];
    }
    return result;
  }

  function makeUUID() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, character => {
      const random = Math.random() * 16 | 0;
      const value = character === 'x' ? random : (random & 0x3 | 0x8);
      return value.toString(16);
    });
  }

  function encodeCollection(value) {
    const bytes = new TextEncoder().encode(JSON.stringify(value));
    let binary = '';
    bytes.forEach(byte => { binary += String.fromCharCode(byte); });
    return btoa(binary)
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/g, '');
  }

  function addCurrentTrackToHeadlight() {
    const current = currentQueue[currentIndex];
    if (!current) return;
    const entry = current.entry;
    const singleTrackCollection = {
      version: 1,
      id: makeUUID(),
      name: entry.title || current.badge || 'Headlight',
      skin: 'normal',
      mode: 'singleEntry',
      entries: [{
        title: entry.title || '',
        url: entry.url,
        artist: entry.artist || null,
        order: 0,
        pinned: false
      }]
    };
    const payload = encodeCollection(singleTrackCollection);
    location.href = `https://open.head-light.app/import/#collection=${payload}`;
  }

  function startPlayback(queue) {
    currentQueue = queue.filter(Boolean);
    currentIndex = 0;
    if (!currentQueue.length) return;
    renderCurrentPlayback(true);
  }

  function renderCurrentPlayback(scrollIntoView = false) {
    const current = currentQueue[currentIndex];
    if (!current) return;
    const wrap = document.getElementById('playerWrap');
    const container = document.getElementById('player');
    wrap.style.display = 'block';
    document.getElementById('playerMeta').style.display = 'grid';
    if (scrollIntoView) {
      wrap.scrollIntoView({behavior:'smooth', block:'center'});
    }
    if (current.provider === 'youtube') {
      playYouTube(current);
    } else {
      discardYouTubePlayer();
      container.replaceChildren();
      const frame = document.createElement('iframe');
      frame.src = current.embedURL;
      frame.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
      frame.allowFullscreen = true;
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.loading = 'eager';
      frame.title = current.entry.title || current.badge;
      container.append(frame);
    }

    document.getElementById('playerBadge').textContent = current.badge;
    document.getElementById('playerTitle').textContent = current.entry.title || current.badge;
    document.getElementById('playerHost').textContent = current.entry.artist || new URL(current.entry.url).hostname.replace(/^www\./,'');
    document.getElementById('addTrack').hidden = false;
    document.getElementById('prevTrack').hidden = currentQueue.length < 2;
    document.getElementById('nextTrack').hidden = currentQueue.length < 2;
  }

  function stepPlayback(direction) {
    if (currentQueue.length < 2) return;
    currentIndex = (currentIndex + direction + currentQueue.length) % currentQueue.length;
    renderCurrentPlayback(false);
  }

  document.getElementById('play').addEventListener('click', () => startPlayback([...playableItems]));
  document.getElementById('shuffle').addEventListener('click', () => startPlayback(shuffledCopy(playableItems)));
  document.getElementById('prevTrack').addEventListener('click', () => stepPlayback(-1));
  document.getElementById('addTrack').addEventListener('click', addCurrentTrackToHeadlight);
  document.getElementById('nextTrack').addEventListener('click', () => stepPlayback(1));
</script>
</body>
</html>
